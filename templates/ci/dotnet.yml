# DevBox CI. One required job, "verify", runs the same gates as `devbox verify` locally,
# read from .devbox/config so local and CI never drift.
# Actions are pinned to full commit SHAs (OpenSSF Scorecard: Pinned-Dependencies); Dependabot bumps them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Verify gates
        run: .devbox/bin/devbox verify
