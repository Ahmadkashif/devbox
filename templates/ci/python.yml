# DevBox CI. One required job, "verify", runs the same gates as `devbox verify` locally,
# read from .devbox/config so local and CI never drift.
# Actions are pinned to full commit SHAs (OpenSSF Scorecard: Pinned-Dependencies); Dependabot bumps them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: |
          if [ -f uv.lock ]; then uv sync --locked --all-extras --dev
          elif [ -f pyproject.toml ]; then uv sync --all-extras --dev
          elif [ -f requirements.txt ]; then uv venv && uv pip install -r requirements.txt
          fi
      - name: Verify gates
        run: .devbox/bin/devbox verify
