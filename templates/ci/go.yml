# DevBox CI. One required job, "verify", runs the same gates as `devbox verify` locally,
# read from .devbox/config so local and CI never drift.
# Actions are pinned to full commit SHAs (OpenSSF Scorecard: Pinned-Dependencies); Dependabot bumps them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download modules
        run: go mod download
      - name: Verify gates
        run: .devbox/bin/devbox verify
